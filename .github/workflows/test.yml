name: Schedule rule audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci
      - name: Lint (bug-catching rules)
        run: npm run lint
      - name: Engine unit tests (fast, no browser)
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the rule audit
        run: npm test

  cloud:
    # firestore.rules and the staff request link, in the Firebase emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Security rules and staff request link (Firebase emulators)
        run: npm run test:cloud
